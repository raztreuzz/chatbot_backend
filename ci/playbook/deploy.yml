---
- name: Deploy Zara webhook
  hosts: zara_webhook
  become: false

  vars:
    app_dir: "{{ lookup('env', 'DEPLOY_PATH') | default('/home/raztreuzz/apps/zara-webhook', true) }}"
    repo_url: "{{ lookup('env', 'REPO_URL') }}"
    repo_branch: "{{ lookup('env', 'DEPLOY_BRANCH') | default('main', true) }}"
    app_port: "{{ lookup('env', 'APP_PORT') | default('8000', true) }}"
    compose_dir: "{{ app_dir }}/ci/playbook'"

  pre_tasks:
    - name: Validate repository URL
      ansible.builtin.assert:
        that:
          - repo_url | length > 0
        fail_msg: "REPO_URL is empty. Create the repository and configure Jenkins SCM or set REPO_URL."

  tasks:
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: true
        update: true

    - name: Create runtime env file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          APP_NAME=zara-webhook
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT={{ app_port }}
          COMPOSE_PROJECT_NAME=zara_webhook

    - name: Stop old services
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: "{{ compose_dir }}"
      environment:
        APP_NAME: zara-webhook
        APP_ENV: production
        APP_HOST: 0.0.0.0
        APP_PORT: "{{ app_port }}"
        COMPOSE_PROJECT_NAME: zara_webhook
      changed_when: true

    - name: Build and start services
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ compose_dir }}"
      environment:
        APP_NAME: zara-webhook
        APP_ENV: production
        APP_HOST: 0.0.0.0
        APP_PORT: "{{ app_port }}"
        COMPOSE_PROJECT_NAME: zara_webhook
      changed_when: true

    - name: Check webhook health
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
